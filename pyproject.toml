[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "datahub-quality-mutant"
version = "0.1.0"
description = "Mutation testing for DataHub assertions and data contracts"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Quality Mutant contributors" }]
dependencies = ["duckdb>=1.1,<2", "pytz>=2024.1,<2027"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.9,<1"]

[project.scripts]
quality-mutant = "quality_mutant.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/quality_mutant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
